<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="豌豆尖英语。读完整旅行经典，精读重点词句，或按篇查看 Simon 雅思写作范文与分析。">
  <title>豌豆尖英语 · 旅行精读与 Simon 写作</title>
  <link rel="canonical" href="https://wchengjia811-lang.github.io/english-study-library/">
  <link rel="stylesheet" href="reading.css?v=reading-lookup1">
  <script src="reading-editions.js?v=2" defer></script>
  <script src="writing-bank.js?v=1" defer></script>
  <script src="reading-translations.js?v=3" defer></script>

<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="masthead"><a class="brand" href="./">豌豆尖英语 <span>PEA ENGLISH</span></a><nav aria-label="主导航"><a id="travel-link" href="./">旅行精读</a><a id="writing-link" href="#writing">Simon 写作</a></nav></header>
  <main id="main" tabindex="-1">
    <section id="shelf">
      <div class="hero"><p class="kicker">THE READING EDITION / VOL. 01</p><h1>沿着文字，<br>走进欧洲小城。</h1><p>读完一篇旅行经典，带走几个能写进自己文章的词句。</p></div>
      <section class="feature" id="daily-read" aria-label="今日精读"></section>
      <div class="section-title"><div><p class="kicker">THE TRAVEL LIBRARY</p><h2>旅行书架</h2></div><label>筛选地区<select id="country"><option value="">全部地区</option></select></label></div>
      <div id="articles" class="articles"></div>
    </section>
    <section id="writing" hidden>
      <div class="hero"><p class="kicker">THE WRITING DESK</p><h1 tabindex="-1">Simon 写作范文</h1><p>一篇一页。读完范文，再看每一段为什么这样写。</p></div>
      <div id="writing-list"></div>
    </section>
    <article id="reader" hidden></article>
    <noscript>请启用 JavaScript 以打开文章和范文。</noscript>
  </main>
  <dialog id="lookup-tool" aria-labelledby="lookup-tool-title">
    <h2 id="lookup-tool-title">查词工具</h2>
    <form id="lookup-form" action="https://dictionary.cambridge.org/search/english-chinese-simplified/direct/" method="get" target="_blank" rel="noopener noreferrer">
      <label for="lookup-query">单词、短语或专有名词</label>
      <input id="lookup-query" name="q" type="search" maxlength="90" required autofocus>
      <p><button type="submit">查词</button> <button id="lookup-tool-background" type="button">看背景</button> <button id="lookup-tool-close" type="button">关闭</button></p>
    </form>
  </dialog>
  <aside id="selection-lookup" class="selection-lookup" aria-label="选中文字查询" hidden>
    <strong id="lookup-text" lang="en"></strong>
    <a id="lookup-dictionary" target="_blank" rel="noopener noreferrer">查词</a>
    <a id="lookup-background" target="_blank" rel="noopener noreferrer">看背景</a>
    <button id="lookup-close" type="button" aria-label="关闭查词栏">×</button>
  </aside>
  <footer><span>豌豆尖英语</span><span>旅行原文与插图来源见各篇。写作分析为本站学习笔记。</span></footer>
